<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squad Builder Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@100..800&family=Ubuntu:wght@400;500;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* MD Nichrome: uses an installed copy if present. To bundle it, add your licensed file, e.g.
   src: local('MD Nichrome'), url('fonts/MDNichrome-Dark.woff2') format('woff2'); */
@font-face{font-family:'MD Nichrome';src:local('MD Nichrome'),local('MDNichrome-Dark'),local('MD Nichrome Dark');font-weight:100 900;font-display:swap}
/* ============ TOKENS (from Figma variables) ============ */
:root{
  /* color */
  --bg-layout:#eff2fa; --bg-section:#fcfcfd; --bg-primary:#ff3c00;
  --bg-container-lowest:#ffffff; --bg-container-lowest-active:#f5f7fa;
  --bg-off-gray-subtle:#f7f9fc; --bg-off-black-pale:#2a3046; --bg-gray-emphasis:#151923;
  --bg-gray-bold:#d1d9eb; --bg-secondary:#37a25c; --bg-highlight-medium:#3a7824;
  --overlay-pale-medium:rgba(255,255,255,.4); --overlay-white-low:rgba(255,255,255,.3);
  --overlay-inverted-emphasis:#090d15; --overlay-layout-none:rgba(239,239,250,.01);
  --text-gray-emphasis:#151923; --text-gray-strong:#2a3346; --text-gray-subtle:#526789;
  --text-primary:#db3300; --text-inverted:#fff; --text-highlight:#3a7824; --text-purple:#6233ff;
  --fg-green:#169c43; --fg-red:#ff0042; --fg-purple:#6233ff; --fg-gray-strong:#2a3346; --fg-gray-pale:#8092b3;
  --border-container-lowest:#e2e8f8; --border-gray-bold:#a9b9d1; --border-gray-subtle:#c2cee5;
  --border-gray-strong:#8092b3; --border-disabled:#dbe5f5; --border-off-gray-pale:#e2e8f8; --border-primary-bold:#ff3c00;
  --divider-soft:#e1e6ef;
  /* radius */
  --r-6:6px; --r-8:8px; --r-12:12px; --r-16:16px; --r-full:100px;
  /* spacing */
  --s-2:2px; --s-4:4px; --s-8:8px; --s-12:12px; --s-16:16px;
  /* type */
  --font-ui:'Ubuntu Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-ubuntu:var(--font-ui); /* all non-branded text uses Ubuntu Sans */
  --fw-regular:450; --fw-medium:550; --fw-bold:750; /* Figma global/typography/font-weight */
  --font-brand:'MD Nichrome','Betano Nichrome','Betano Nichrome Dark','Barlow Condensed','Arial Narrow',sans-serif; /* brand font; falls back if not installed */
  /* prototype chrome (not from Figma) */
  --stage-bg:#e4e8f3; --panel-bg:#ffffff; --panel-border:#d9deec; --panel-text:#151923; --panel-muted:#526789;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --stage-bg:#14171f; --panel-bg:#1c2029; --panel-border:#2c3240; --panel-text:#eef1f8; --panel-muted:#9aa6c0; }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);font-weight:450;font-variation-settings:"wdth" 100;background:var(--stage-bg);color:var(--panel-text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ============ PROTOTYPE SHELL ============ */
.stage{display:grid;grid-template-columns:260px 1fr;height:100vh;gap:0}
.screen-list{background:var(--panel-bg);border-right:1px solid var(--panel-border);padding:24px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.screen-list h1{font-size:15px;font-weight:700;margin-bottom:2px}
.screen-list p{font-size:12px;color:var(--panel-muted);margin-bottom:14px;line-height:1.4}
.screen-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent}
.screen-item[hidden]{display:none}
.screen-item[hidden]{display:none}
.screen-item .name{font-size:14px;font-weight:600}
.screen-item .meta{font-size:11px;color:var(--panel-muted)}
.screen-item:hover{background:rgba(128,146,179,.12)}
.screen-item[aria-current="true"]{background:rgba(255,60,0,.08);border-color:rgba(255,60,0,.35)}
.screen-item:focus-visible{outline:2px solid var(--bg-primary);outline-offset:2px}
.stage-main{display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.phone-scale{transform-origin:center center}
.phone{width:375px;height:812px;border-radius:44px;background:var(--bg-layout);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #0d1018,0 0 0 11px #3a4256,0 30px 60px rgba(10,14,25,.35)}
.phone{color:#151923}

/* ============ APP CHROME ============ */
.app-header{position:absolute;inset:0 0 auto 0;height:110px;z-index:20;
  background:none;pointer-events:none}
.app-header > *{pointer-events:auto}
.status-bar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;color:#fff;font-weight:700;font-size:16px}
.status-bar .icons{display:flex;gap:6px;align-items:center}
.header-row{height:56px;display:flex;align-items:center;justify-content:flex-end;gap:var(--s-8);padding:0 12px}
.pill-btn{width:40px;height:40px;border-radius:50px;background:var(--overlay-pale-medium);display:grid;place-items:center}
.balance{height:40px;border-radius:50px;background:var(--overlay-pale-medium);display:flex;align-items:center;gap:8px;padding:8px}
.balance .amt{font-size:14px;line-height:20px;color:var(--text-gray-emphasis)}
.balance .amt b{font-weight:750}
.balance .plus{width:26px;height:26px;border-radius:50px;background:var(--bg-secondary);color:#fff;font-weight:750;font-size:16px;display:grid;place-items:center}

.bottom-nav{position:absolute;inset:auto 0 0 0;height:84px;z-index:20;padding-bottom:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(to bottom,var(--overlay-layout-none) 0%,var(--bg-layout) 50%);pointer-events:none}
.bottom-nav .row{display:flex;gap:8px;align-items:center;padding:0 12px;width:100%;pointer-events:auto}
.nav-items{flex:1;display:flex;height:56px;padding:4px 0;border-radius:50px;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 2px 8px rgba(96,115,159,.12)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;font-family:var(--font-ubuntu);font-size:10px;line-height:12px;font-weight:700;color:var(--text-gray-emphasis)}
.nav-item .ico{height:28px;width:44px;border-radius:16px;display:grid;place-items:center}
.chip-switch{height:56px;width:56px;display:grid;place-items:center}
/* Betano glass button with sparkle animation */
.brand-btn{position:relative;width:56px;height:56px;border-radius:50px;display:grid;place-items:center;overflow:visible;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.38)); /* same glass as the nav pill */
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 2px 8px rgba(96,115,159,.12)}
.brand-btn::before{content:"";position:absolute;inset:0;border-radius:50px;overflow:hidden;z-index:1;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;
  animation:shine 3.2s ease-in-out infinite}
.brand-btn svg.logo{position:relative;z-index:2}
.brand-btn .sp{position:absolute;z-index:3;width:10px;height:10px;opacity:0;pointer-events:none;
  background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  filter:drop-shadow(0 0 3px rgba(255,160,100,.9));animation:twinkle 2.4s ease-in-out infinite}
.brand-btn .sp:nth-of-type(1){top:2px;right:6px;animation-delay:0s}
.brand-btn .sp:nth-of-type(2){bottom:7px;left:3px;width:8px;height:8px;animation-delay:.8s}
.brand-btn .sp:nth-of-type(3){top:14px;right:2px;width:7px;height:7px;animation-delay:1.5s}
.brand-btn:active{transform:scale(.96)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes shine{0%,55%{background-position:150% 0}100%{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){.brand-btn::before,.brand-btn .sp{animation:none}.brand-btn .sp{opacity:.8;transform:none}}
.home-bar{width:120px;height:4px;border-radius:100px;background:var(--bg-gray-emphasis)}

/* ============ SCREEN SCAFFOLD ============ */
.screen{position:absolute;inset:110px 0 0 0;overflow-y:auto;overflow-x:hidden;padding-top:0;padding-bottom:96px;background:transparent;display:none;z-index:1;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.glass{background:var(--overlay-pale-medium)}

/* Subheader */
.subheader{display:flex;align-items:center;gap:8px;padding:8px;height:58px}
.subheader .left{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.league-pill{height:40px;border-radius:50px;background:var(--overlay-pale-medium);display:flex;align-items:center;gap:8px;padding:8px 12px;min-width:0}
.league-pill .title{display:flex;align-items:center;gap:2px}
.mini-icons{display:flex}
.mini-icon{width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid var(--border-gray-bold);display:grid;place-items:center;font-size:8px;margin-right:-4px}
.league-pill .name{font-weight:750;font-size:14px;line-height:20px;white-space:nowrap;margin-left:6px}

/* Scoreboard */
.scoreboard{padding:0 8px 8px}
.stats-summary{backdrop-filter:blur(5px);background:var(--overlay-pale-medium);box-shadow:inset 0 0 0 1px var(--border-container-lowest);border-radius:var(--r-12);padding:9px 9px 13px;display:flex;flex-direction:column;align-items:center}
.sponsor{display:flex;align-items:center;gap:2px;background:#fff;border-radius:var(--r-full);padding:2px 4px;margin-bottom:3px;width:111px;justify-content:center;align-self:flex-start}
.sponsor .logo{font-weight:750;font-style:italic;font-size:10px;color:var(--text-primary);letter-spacing:-.3px}
.sponsor .txt{font-family:var(--font-ubuntu);font-size:9px;line-height:12px;font-weight:450;color:var(--text-primary)}
.match{display:flex;gap:12px;align-items:center;justify-content:center;width:100%}
.team{flex:1;display:flex;flex-direction:column;align-items:center}
.team .badge{width:28px;height:28px;border-radius:50%;background:var(--overlay-white-low);display:grid;place-items:center;font-size:14px;margin-bottom:2px}
.team .tname{font-family:var(--font-brand);font-weight:700;font-size:14px;line-height:18px;height:40px;display:flex;align-items:center;color:var(--text-gray-strong);text-transform:uppercase}
.form{display:flex;gap:4px;justify-content:center;padding-top:1px}
.tile{padding:2px;display:flex;flex-direction:column;gap:1px}
.tile i{display:block;width:8px;height:8px;border-radius:1px}
.tile em{display:block;width:8px;height:2px;border-radius:1px}
.kickoff{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;line-height:16px;font-weight:550;color:var(--text-gray-strong);text-align:center}
.kickoff .ico{display:flex;gap:4px;height:22px;align-items:center}

/* AI prompts */
.prompts{display:flex;gap:8px;padding:0 8px;opacity:.8;overflow:hidden;height:32px}
.prompts.shifted{padding-left:16px;margin:8px 0} /* Markets: frame x=8 + inner x=8, 8px gaps above/below */
.prompt{flex:none;height:32px;border:1px solid var(--border-container-lowest);background:#fff;border-radius:999px;display:flex;gap:4px;align-items:center;padding:0 8px;font-size:12px;line-height:16px;font-weight:450;white-space:nowrap;overflow:hidden}
.prompt svg{flex:none}

/* Primary tabs */
.tab-primary{padding:8px}
.tab-primary .tabs{display:flex;height:32px;border-radius:16px;background:var(--overlay-pale-medium)}
.tab-primary button{flex:1;min-width:64px;height:32px;border-radius:50px;font-family:var(--font-brand);font-weight:700;font-size:14px;line-height:18px;text-transform:uppercase;color:var(--text-gray-emphasis)}
.tab-primary button[aria-selected="true"]{background:var(--overlay-inverted-emphasis);color:var(--text-inverted);border-radius:16px}

/* Secondary tabs */
.sec-menu{padding:0 8px 8px}
.sec-menu .box{background:var(--overlay-pale-medium);border-radius:var(--r-12);display:flex;align-items:center;justify-content:space-between;padding-left:8px;overflow:hidden}
.sec-tabs{flex:1;display:flex;gap:4px;padding:8px 0;overflow-x:auto;scrollbar-width:none;min-width:0}
.sec-tabs::-webkit-scrollbar{display:none}
.sec-tab{flex:none;height:32px;padding:0 12px;border-radius:16px;font-family:var(--font-ubuntu);font-size:12px;line-height:16px;font-weight:550;color:var(--text-gray-emphasis);display:flex;align-items:center}
.sec-tab[aria-selected="true"]{background:var(--bg-off-black-pale);color:#fff}

/* generic card */
.card{background:#fff;box-shadow:inset 0 0 0 1px var(--border-container-lowest);border-radius:var(--r-12)}
.section{padding:0 8px}

/* Market cards */
/* Figma strokes are INSIDE the frame, so the border is an inset shadow and never changes layout */
.mcard{position:relative;margin:4px 8px 8px;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:hidden;border:0;box-shadow:inset 0 0 0 1px var(--border-container-lowest)}
.mtitle{display:flex;align-items:center;gap:8px;padding:0 2px;min-height:20px}
.mtitle .name{flex:1;font-size:14px;line-height:20px;font-weight:450;color:var(--text-gray-strong)}
.chev{width:16px;height:16px;display:grid;place-items:center;flex:none}
.offers{display:flex;gap:8px;align-items:center}
/* Offer labels (Figma Offer / Label S): icon 18x16 (z3) + gradient text (z2) + 4px edge (z1), no gaps, 16px tall */
.offer-ep,.offer-so{display:flex;align-items:center;height:16px;isolation:isolate;flex:none}
.offer-ep .ic,.offer-so .ic{flex:none;height:16px;display:block;position:relative;z-index:3}
.offer-ep .ic{width:18px}.offer-so .ic{width:16px}
.offer-ep .tx,.offer-so .tx{position:relative;z-index:2;height:16px;padding:0 4px;display:flex;align-items:center;white-space:nowrap;color:#fff;
  font-family:var(--font-brand);font-weight:700;font-size:12px;line-height:16px}
.offer-ep .tx{background:linear-gradient(76.76deg,#005757 0%,#007575 100%)}
.offer-so .tx{background:linear-gradient(75.53deg,#a10808 0%,#ff6600 100%)}
.offer-ep .edge,.offer-so .edge{position:relative;z-index:1;width:4px;height:16px;flex:none}
.offer-ep .edge{background:#007575;clip-path:polygon(0 0,100% 50%,0 100%)}
.offer-so .edge{background:#ff6600;clip-path:polygon(0 0,100% 50%,0 100%)}
.sels{display:flex;gap:8px}
.sel{flex:1;min-width:56px;border-radius:var(--r-8);background:linear-gradient(to top,var(--bg-container-lowest-active),#fff)}
.sel .c{height:48px;background:var(--bg-off-gray-subtle);border:1px solid var(--border-off-gray-pale);border-radius:var(--r-8);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 4px 6px}
.sel .odd{font-weight:750;font-size:14px;line-height:20px;color:var(--text-highlight)}
.sel .lbl{font-size:11px;line-height:14px;font-weight:450;color:var(--text-gray-emphasis);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.sel .prog{display:flex;gap:2px;align-items:flex-start;padding:5px 4px}
.bar{flex:1;display:flex;background:var(--bg-section);border:1px solid var(--border-disabled);border-radius:50px;overflow:hidden;height:8px}
.bar span{flex:1;height:6px}
.bar span.on{background:var(--fg-purple)}
.sel .pct{font-weight:750;font-size:11px;line-height:14px;width:24px;height:8px;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:var(--text-gray-strong)}
.trend{padding:4px;font-size:11px;line-height:14px;font-weight:450;color:var(--text-gray-subtle)}
.trend b{color:var(--text-purple);font-weight:750}
.insight-wrap{overflow:hidden}
.insights{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px}
.insights::-webkit-scrollbar{display:none}
.insight{flex:none;width:100%;scroll-snap-align:start;background:var(--bg-off-gray-subtle);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;position:relative;overflow:hidden}
.insight::before{content:"";position:absolute;left:0;top:0;width:33px;height:48px;background:linear-gradient(135deg,rgba(98,51,255,.18),transparent 70%)}
.insight .logo{width:24px;height:24px;border-radius:50%;background:var(--overlay-white-low);display:grid;place-items:center;font-size:16px;flex:none;position:relative}
.insight p{font-family:var(--font-ubuntu);font-size:12px;line-height:16px;font-weight:450;position:relative}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}

/* Pre-event market card (Over/Under) */
.pcard .tname{flex:1;font-family:var(--font-ubuntu);font-size:14px;line-height:16px;font-weight:450;color:var(--text-gray-strong);min-height:20px;display:flex;align-items:center}
.pcard .cols{display:flex;gap:8px;align-items:center;justify-content:center}
.pcard .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sbtn{height:36px;min-height:36px;display:flex;gap:4px;align-items:center;padding:10px 8px;background:var(--bg-off-gray-subtle);border:1px solid var(--border-off-gray-pale);border-radius:8px;overflow:hidden}
.sbtn .l{flex:1;min-width:0;font-size:12px;line-height:16px;font-weight:450;color:var(--text-gray-emphasis);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn .o{font-size:14px;line-height:20px;font-weight:750;color:var(--text-highlight);text-align:right;white-space:nowrap}
.showall{height:32px;display:flex;align-items:center;justify-content:center;padding:8px;font-size:12px;line-height:16px;font-weight:750;color:var(--text-gray-emphasis);width:100%}
.bb-ind{position:absolute;top:0;right:0;padding:0 6px;background:var(--fg-primary-bold,#ff3c00);color:#fff;border-radius:0 12px 0 8px;font-family:var(--font-ubuntu);font-size:9px;line-height:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dots i{width:4px;height:4px;border-radius:8px;background:var(--fg-gray-pale)}
.dots i.on{background:var(--fg-gray-strong)}

/* Footer */
.footer{margin-top:16px;color:var(--text-gray-strong)}
.footer .info{padding:16px;font-size:12px;line-height:16px;color:var(--text-gray-subtle)}
.footer hr{border:0;border-top:1px solid var(--divider-soft)}
.footer .fhead{display:flex;justify-content:space-between;align-items:center;padding:20px 16px;font-weight:750;font-size:14px;line-height:16px}
.footer .links{display:flex;flex-wrap:wrap;gap:8px 16px;padding:0 16px 16px;font-size:12px;line-height:16px}
.footer .about{padding:0 16px 16px;font-size:12px;line-height:16px;color:var(--text-gray-subtle)}
.footer .social{display:flex;gap:12px;justify-content:center;padding:32px 0 8px}
.footer .social i{width:40px;height:40px;border-radius:50%;background:var(--bg-container-medium,#eaeefb);display:block}
.footer .play{text-align:center;font-family:var(--font-brand);font-weight:700;font-size:16px;padding:12px 0 24px;color:var(--text-gray-emphasis)}
/* Stats */
.opta{margin:4px 8px 8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.opta h2,.stat-tbl h2{font-weight:550;font-size:16px;line-height:24px;text-align:center}
.opta .rows{display:flex;flex-direction:column;gap:12px}
.opta .row{display:flex;gap:8px;align-items:center;font-size:12px;line-height:16px}
.opta .row .ic{width:20px;height:20px;border-radius:12px;display:grid;place-items:center;flex:none}
.tiny-btn{align-self:center;height:24px;padding:0 8px;border-radius:12px;background:var(--bg-off-gray-subtle);font-weight:550;font-size:11px;line-height:14px;color:var(--text-gray-strong)}
.stat-tbl{margin:0 8px 8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.stat-grid .label{text-align:center;font-size:12px;line-height:16px;color:var(--text-gray-emphasis)}
.stat-val{display:inline-flex;align-items:center;height:28px;padding:4px 10px;border-radius:14px;font-weight:750;font-size:14px;line-height:20px}
.stat-val.win{background:var(--bg-highlight-medium);color:#fff}
.stat-val.lose{background:transparent;color:var(--text-gray-emphasis)}
.stat-grid .l{justify-self:start}.stat-grid .r{justify-self:end}
/* Social */
.post-btn{display:flex;align-items:center;gap:4px;height:32px;padding:0 8px;border:1px solid var(--border-gray-emphasis,#151923);border-radius:8px;font-weight:750;font-size:12px;line-height:12px;text-transform:uppercase;color:var(--text-gray-emphasis)}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:750;font-size:12px}
.poll{margin:8px 8px 0;padding:12px 0 0;border-radius:var(--r-16);background:#fff;box-shadow:inset 0 0 0 1px var(--border-container-lowest);display:flex;flex-direction:column;gap:4px}
.poll .ph{display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.poll .ph h3{font-family:var(--font-brand);font-weight:700;font-size:16px;line-height:20px;text-transform:uppercase}
.proof{display:flex;align-items:center;gap:3px;border:1px solid var(--border-gray-subtle);border-radius:4px;padding:2px 6px 2px 4px;font-weight:550;font-size:12px;line-height:16px}
.poll .opts{display:flex;gap:8px;align-items:stretch;padding:8px 12px 12px;height:100px;align-items:center}
.opt{flex:1;display:flex;align-items:center;gap:4px;padding:8px;border:1px solid var(--border-container-lowest);border-radius:8px;font-family:var(--font-brand);font-weight:700;font-size:14px;line-height:18px;text-transform:uppercase;min-width:0;height:44px}
.opt.draw{flex:none;justify-content:center}
.opt.right{justify-content:flex-end;text-align:right}
.opt[aria-pressed="true"]{border-color:var(--border-primary-bold);background:rgba(255,60,0,.06)}
.opt .lg{width:24px;height:24px;border-radius:50%;background:var(--overlay-white-low);display:grid;place-items:center;font-size:14px;flex:none}
.poll .result{padding:0 12px 12px;font-size:12px;line-height:16px;color:var(--text-gray-subtle);display:none}
.poll.voted .result{display:block}
.gen-head{padding:16px 16px 8px}
.gen-head h2{font-family:var(--font-brand);font-weight:700;font-size:20px;line-height:24px;text-transform:uppercase}
.gen-sub{padding:0 16px 8px;font-size:12px;line-height:16px;color:var(--text-gray-strong)}
.chips{display:flex;gap:8px;padding:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:24px;padding:0 8px;border:1px solid var(--border-gray-strong);border-radius:8px;font-weight:550;font-size:12px;line-height:16px;display:flex;align-items:center;color:var(--text-gray-emphasis)}
.chip[aria-pressed="true"]{background:var(--bg-gray-emphasis);border-color:var(--bg-gray-emphasis);color:#fff}
.post{margin:0 8px 8px;padding:12px;display:flex;flex-direction:column;gap:12px}
.post .ph{display:flex;align-items:center;gap:8px}
.post .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:750;font-size:16px;flex:none}
.post .who{flex:1;min-width:0}
.post .who b{display:flex;align-items:center;gap:4px;font-size:14px;line-height:20px;font-weight:750}
.post .who span{display:block;font-size:12px;line-height:16px;color:var(--text-gray-subtle)}
.post .ts{font-size:11px;line-height:14px;color:var(--text-gray-subtle)}
.post .body{font-size:14px;line-height:20px}
.post .actions{display:flex;gap:16px;font-size:12px;line-height:16px;color:var(--text-gray-subtle)}
.post .actions button{display:flex;align-items:center;gap:4px;color:inherit;font-weight:550}
.post .actions button[aria-pressed="true"]{color:var(--fg-red)}
.slip{background:var(--bg-off-gray-subtle);border:1px solid var(--border-container-lowest);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.slip .leg{display:flex;justify-content:space-between;font-size:12px;line-height:16px}
.slip .leg b{font-weight:750}
.slip .tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--divider-soft);padding-top:8px;font-size:12px}
.copy-btn{height:32px;padding:0 16px;border-radius:8px;background:var(--bg-primary);color:#fff;font-weight:750;font-size:12px}
.h-scroll{display:flex;gap:10px;overflow-x:auto;padding:8px;scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}
.sug{flex:none;width:160px;height:200px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sug .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:750;font-size:18px}
.sug b{font-size:14px;line-height:20px;font-weight:750}
.sug span{font-size:12px;line-height:16px;color:var(--text-gray-subtle)}
.sug .follow{margin-top:auto;height:32px;width:100%;border-radius:8px;border:1px solid var(--bg-gray-emphasis);font-weight:750;font-size:12px}
.sug .follow[aria-pressed="true"]{background:var(--bg-gray-emphasis);color:#fff}

.crest{display:block;width:100%;height:100%}
.team .badge .crest{width:21px;height:21px}
.insight .logo .crest{width:20px;height:20px}
.opt .lg .crest{width:20px;height:20px}

/* Team-colour page backdrop: Aston Villa claret + sky blue (left/centre) to Juventus black/white (right), dissolving downward */
.page-glow{position:absolute;inset:0 0 auto 0;height:520px;z-index:0;pointer-events:none;
  background:
    radial-gradient(70% 60% at 0% 0%,#7b0f45 0%,rgba(123,15,69,.85) 35%,rgba(123,15,69,0) 100%),
    radial-gradient(60% 55% at 50% 12%,rgba(149,191,229,.95) 0%,rgba(149,191,229,0) 100%),
    radial-gradient(70% 60% at 100% 0%,#0d0d12 0%,rgba(13,13,18,.8) 35%,rgba(13,13,18,0) 100%),
    linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,0));
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.9) 25%,rgba(0,0,0,.45) 60%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.9) 25%,rgba(0,0,0,.45) 60%,transparent 100%)}

/* Compact sticky header (replaces the balance row once the page is scrolled) */
.mini-header{position:absolute;left:0;right:0;top:54px;height:56px;z-index:21;display:flex;align-items:center;gap:8px;padding:0 12px;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.mini-header .mini-match{flex:1;height:40px;border-radius:50px;background:var(--overlay-pale-medium);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;min-width:0}
.mini-match .t{display:flex;align-items:center;gap:6px;font-family:var(--font-brand);font-weight:700;font-size:14px;line-height:18px;color:var(--text-gray-strong);text-transform:uppercase}
.mini-match .t .crest{width:20px;height:20px;flex:none}
.mini-match .k{font-size:12px;line-height:16px;font-weight:550;color:var(--text-gray-strong);text-align:center;white-space:nowrap}
.header-row{transition:opacity .2s ease,transform .2s ease}
.phone.scrolled .header-row{opacity:0;transform:translateY(6px);pointer-events:none}
.phone.scrolled .mini-header{opacity:1;transform:none;pointer-events:auto}
.phone.scrolled .screen.active{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);mask-image:linear-gradient(to bottom,transparent 0,#000 14px)}
@media (prefers-reduced-motion:reduce){.mini-header,.header-row{transition:none}}

/* ============ SIDEBAR FOOTER + EXPLORATION NOTES ============ */
.side-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--panel-border)}
.side-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:36px;border-radius:10px;border:1px solid var(--panel-border);font-size:13px;font-weight:550;background:transparent}
.side-btn:hover{background:rgba(128,146,179,.12)}
.side-btn[aria-current="true"]{background:rgba(255,60,0,.08);border-color:rgba(255,60,0,.35)}
.side-btn.primary{background:var(--panel-text);color:var(--panel-bg);border-color:transparent}
.side-btn:focus-visible{outline:2px solid var(--bg-primary);outline-offset:2px}
.build{font-size:11px;line-height:16px;color:var(--panel-muted)}
.build b{color:var(--panel-text);font-weight:550}
.build code{font-family:var(--font-ui);font-weight:550;font-size:11px}
.notes{position:absolute;inset:0;overflow-y:auto;background:var(--stage-bg);padding:40px 48px 64px;display:none}
.notes.open{display:block}
.stage-main.notes-open .phone-scale{visibility:hidden}
.notes-inner{max-width:760px;margin:0 auto;color:var(--panel-text)}
.notes h2{font-size:26px;line-height:32px;font-weight:750;margin-bottom:6px}
.notes .lede{font-size:14px;line-height:22px;color:var(--panel-muted);margin-bottom:28px}
.notes h3{font-size:15px;font-weight:750;margin:32px 0 10px;padding-top:20px;border-top:1px solid var(--panel-border)}
.notes p,.notes li{font-size:14px;line-height:22px}
.notes ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.notes code{font-family:var(--font-ui);font-weight:550;font-size:12px;background:rgba(128,146,179,.16);padding:1px 5px;border-radius:5px}
.notes table{width:100%;border-collapse:collapse;font-size:13px;line-height:20px;margin-top:6px}
.notes th,.notes td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--panel-border)}
.notes th{font-weight:750;color:var(--panel-muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.notes .tag{display:inline-block;font-size:11px;font-weight:550;padding:1px 8px;border-radius:99px;background:rgba(255,60,0,.1);color:var(--text-primary);white-space:nowrap}
.notes .tag.ok{background:rgba(22,156,67,.12);color:#169c43}
.notes .back{margin-bottom:20px;width:auto;padding:0 14px}
@media (max-width:760px){.stage{grid-template-columns:200px 1fr}.notes{padding:24px 20px 48px}}
/* ============ SQUAD BUILDER (tokens from KDS reference frames) ============ */
:root{
  --bg-container-medium:#eaeefb;      /* sem/color/bg/container/medium/default */
  --bg-container-low-active:#e2e8f8;  /* sem/color/bg/container/low/active */
  --border-off-gray-medium:#c2cee5;   /* sem/color/border/off-gray/medium */
  --border-gray-pale:#e2e8f8;         /* sem/color/border/gray/pale */
  --pitch-green:#107030;              /* global/color/green/70 */
  --pitch-border:#153822;             /* global/color/emerald/40 */
  --shadow-sm:1px 4px 4px rgba(21,25,35,.1);
}
.sq{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.sq .ti{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:550;color:var(--text-gray-subtle);padding:0 0 0 0}
.sq .stack{display:flex;flex-direction:column;gap:4px}
/* QuestionCard / GenericQuestionCard */
.qcard{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px 8px 12px;border-radius:12px;background:#fff;
  box-shadow:inset 0 0 0 1px var(--border-gray-pale);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);width:100%;text-align:left}
.qcard.generic{padding:10px}
.qcard .asset{width:32px;height:32px;border-radius:50px;background:var(--bg-container-medium);display:grid;place-items:center;flex:none}
.qcard .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qcard .ct b{font-size:14px;line-height:20px;font-weight:750;color:var(--text-gray-emphasis);text-align:left}
.qcard .ct span{font-size:11px;line-height:14px;font-weight:450;color:var(--text-gray-strong)}
.qcard .ct em{font-style:normal;font-size:11px;line-height:14px;font-weight:550;color:var(--fg-red)}
.qcard.sel{background:var(--bg-container-lowest-active);box-shadow:inset 0 0 0 1px var(--border-off-gray-medium)}
.qcard.na{opacity:.6}
.qcard.na .asset svg{filter:grayscale(1)}
.chev28{width:28px;height:28px;border-radius:50px;display:grid;place-items:center;flex:none}
.pbtn{width:28px;height:28px;border-radius:50px;background:var(--bg-container-medium);display:grid;place-items:center;flex:none}
.pbtn:disabled{opacity:.5;cursor:not-allowed}
.pbtn.on{background:var(--bg-gray-emphasis);color:#fff}
.sicon{width:32px;height:32px;border-radius:50px;background:var(--bg-container-medium);display:grid;place-items:center;flex:none}
.pill{height:24px;padding:4px 8px;border-radius:4px;background:var(--bg-container-low-active);font-weight:750;font-size:13px;line-height:18px;color:var(--text-highlight);display:inline-flex;align-items:center;white-space:nowrap}
.pill.n{color:var(--text-gray-strong);font-weight:550;font-size:12px}
/* intro / steps */
.sq .intro{padding:12px;background:var(--overlay-pale-medium);border-radius:var(--r-12);box-shadow:inset 0 0 0 1px var(--border-gray-pale);display:flex;flex-direction:column;gap:4px}
.sq .intro h3{font-family:var(--font-brand);font-weight:700;font-size:16px;line-height:20px;text-transform:uppercase}
.sq .intro p{font-size:12px;line-height:16px;color:var(--text-gray-strong)}
.steps{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--overlay-pale-medium)}
.steps button{flex:1;height:32px;border-radius:16px;font-size:12px;line-height:16px;font-weight:550;color:var(--text-gray-emphasis);display:flex;align-items:center;justify-content:center;gap:6px}
.steps button[aria-current="step"]{background:var(--bg-off-black-pale);color:#fff}
.steps button:disabled{opacity:.5;cursor:not-allowed}
.steps .n{width:16px;height:16px;border-radius:50%;background:rgba(128,146,179,.25);display:grid;place-items:center;font-size:10px;font-weight:750}
.steps button[aria-current="step"] .n{background:rgba(255,255,255,.25)}
.seg{display:flex;height:32px;border-radius:16px;background:var(--bg-container-medium);padding:0}
.seg button{flex:1;border-radius:16px;font-size:12px;font-weight:550;color:var(--text-gray-emphasis);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--overlay-inverted-emphasis);color:#fff}
.count{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:var(--bg-container-medium);font-size:12px;font-weight:750}
.hint{font-size:12px;line-height:16px;color:var(--text-gray-subtle);padding:0 4px}
.hint.warn{color:var(--fg-red)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
/* chips */
.chips2{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0}
.chips2::-webkit-scrollbar{display:none}
.chip2{flex:none;height:24px;padding:0 8px;border:1px solid var(--border-gray-strong);border-radius:8px;font-weight:550;font-size:12px;line-height:16px;display:flex;align-items:center;color:var(--text-gray-emphasis)}
.chip2[aria-pressed="true"]{background:var(--bg-gray-emphasis);border-color:var(--bg-gray-emphasis);color:#fff}
/* pitch (Lineups widget) */
.pitch{position:relative;border-radius:12px;overflow:hidden;background:var(--pitch-green);box-shadow:inset 0 0 0 2px var(--pitch-border)}
.pitch .grass{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.09) 0 65px,transparent 65px 130px)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pitch .shade{position:absolute;left:0;right:0;top:0;height:48px;background:linear-gradient(to bottom,rgba(9,13,21,.5),rgba(9,13,21,0))}
.pitch .formation{position:relative;padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.pitch .prow2{display:flex;gap:8px;align-items:flex-start;justify-content:center;min-height:96px}
.slot{flex:1;max-width:96px;min-width:48px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;color:#fff}
.slot .sh{position:relative;width:48px;height:40px;display:grid;place-items:center}
.slot .x{position:absolute;right:-2px;top:-4px;width:16px;height:16px;border-radius:50%;background:#fff;color:var(--text-gray-emphasis);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:750;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.slot .sname{font-size:10px;line-height:12px;font-weight:450;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .ssub{font-size:10px;line-height:12px;opacity:.75}
.slot.empty .ghost{width:40px;height:40px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.7);display:grid;place-items:center;font-size:20px;line-height:1;color:#fff;background:rgba(255,255,255,.08)}
.slot.empty.optional .ghost{opacity:.6}
.slot.pulse .ghost{animation:pulse 1s ease 2}
@keyframes pulse{50%{background:rgba(255,255,255,.35);transform:scale(1.08)}}
/* strip (variant B) */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.strip::-webkit-scrollbar{display:none}
.scard{flex:none;width:96px;min-height:104px;padding:8px 6px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-gray-pale);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.scard .sn{font-size:12px;line-height:16px;font-weight:750;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .ss{font-size:10px;line-height:12px;color:var(--text-gray-strong)}
.scard em{font-style:normal;font-size:10px;line-height:12px;font-weight:550;color:var(--fg-red)}
.scard.sel{background:var(--bg-container-lowest-active);box-shadow:inset 0 0 0 1px var(--border-off-gray-medium)}
.scard.na{opacity:.6}
.scard .add{margin-top:auto;width:100%;height:24px;border-radius:8px;background:var(--bg-container-medium);font-size:11px;font-weight:750}
.scard .add.on{background:var(--bg-gray-emphasis);color:#fff}
.scard .add:disabled{opacity:.5}
/* targets */
.tcard{padding:12px;display:flex;flex-direction:column;gap:12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-gray-pale)}
.tcard .th{display:flex;align-items:center;gap:12px}
.tcard .th .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.tcard .th b{font-size:14px;line-height:20px;font-weight:750}
.tcard .th span{font-size:11px;line-height:14px;color:var(--text-gray-strong)}
.rm{width:24px;height:24px;border-radius:50%;background:var(--bg-container-medium);display:grid;place-items:center;font-size:14px;line-height:1;flex:none}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .sb{width:32px;height:32px;border-radius:50%;background:var(--bg-container-medium);display:grid;place-items:center;font-size:18px;font-weight:550;line-height:1}
.stepper .sb:disabled{opacity:.4}
.stepper .val{min-width:56px;text-align:center;font-weight:750;font-size:20px;line-height:24px}
.stepper .val small{font-size:12px;font-weight:550;color:var(--text-gray-subtle);margin-left:2px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{height:24px;padding:0 8px;border-radius:8px;border:1px solid var(--border-gray-strong);font-size:12px;font-weight:550;display:flex;align-items:center;gap:4px}
.preset[aria-pressed="true"]{background:var(--bg-gray-emphasis);border-color:var(--bg-gray-emphasis);color:#fff}
.diff{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:550}
.diff .segs{display:flex;gap:3px;width:64px;flex:none}
.diff .segs i{flex:1;height:6px;border-radius:3px;background:var(--border-disabled)}
.lv1 .segs i.on{background:var(--fg-green)}.lv2 .segs i.on{background:var(--fg-yellow-bold,#d6b300)}.lv3 .segs i.on{background:#ff6600}.lv4 .segs i.on{background:var(--fg-red)}
.lv1 .lab{color:var(--fg-green)}.lv2 .lab{color:#a38000}.lv3 .lab{color:#c24d00}.lv4 .lab{color:var(--fg-red)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ttile{padding:10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-gray-pale);display:flex;flex-direction:column;gap:8px;position:relative}
.ttile b{font-size:13px;line-height:18px;font-weight:750;padding-right:24px}
.ttile .rm{position:absolute;right:8px;top:8px}
.ttile .stepper{justify-content:space-between}
.ttile .stepper .sb{width:28px;height:28px}
.ttile .stepper .val{font-size:18px;min-width:40px}
.bigpre{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bigpre button{border-radius:10px;padding:8px 4px;background:var(--bg-off-gray-subtle);box-shadow:inset 0 0 0 1px var(--border-off-gray-pale);display:flex;flex-direction:column;align-items:center;gap:2px}
.bigpre button span{font-size:11px;line-height:14px;color:var(--text-gray-strong)}
.bigpre button b{font-size:16px;line-height:20px;font-weight:750}
.bigpre button[aria-pressed="true"]{background:var(--bg-gray-emphasis);box-shadow:none;color:#fff}
.bigpre button[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
/* squad summary strip */
.sumstrip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--border-gray-pale)}
.sumstrip .shirts{display:flex;flex:1;gap:2px;min-width:0}
.sumstrip .shirts button{position:relative;display:flex;flex-direction:column;align-items:center;width:44px;font-size:10px;line-height:12px}

:is(:is(#squad-p,#squad-v),#squad-q,#squad-r) .p-sub .k-pos{margin:0}
:is(:is(#squad-p,#squad-v),#squad-q,#squad-r) em.k-lu{display:inline-flex;align-items:center;width:fit-content;height:14px;padding:0 5px;border-radius:4px;background:#e8f6ed;color:#1f7a45;font-style:normal;font-weight:700;font-size:9px;line-height:12px;white-space:nowrap}
:is(:is(#squad-p,#squad-v),#squad-q,#squad-r) em.k-lu.conf{background:#37a25c;color:#fff}

:is(:is(#squad-p,#squad-v),#squad-q,#squad-r,#squad-o) .p-on .k-rmv{display:inline-flex}
:is(:is(#squad-p,#squad-v),#squad-q,#squad-r,#squad-o) .p-on .k-rmv~*{display:none}

#squad-q .q-r.p-on{height:auto;min-height:60px;padding-top:4px;padding-bottom:4px}
#squad-q .q-r.p-on .q-tm{height:auto;min-height:58px;align-self:stretch}
#squad-q .q-nm i.k-rmv{color:#fff;font-weight:700;font-size:9px;line-height:12px} /* the position label style was overriding the Remove tag */
:is(:is(#squad-p,#squad-v),#squad-q,#squad-r) .q-ch{padding:4px}
:is(:is(#squad-p,#squad-v),#squad-q,#squad-r) .q-ch img{width:24px;height:24px}
/* ===== Squad Builder 3 · new player card (Figma 6481-93589) =====
   layers: container/lowest/default, team-colour gradient (bottom to top, transparent at the top), brand graphic on top of both;
   name, position, jersey and number keep their positions; odds + last 5 sit on a blurred panel */
#phone #squad-v .p-t.v-t{height:230px;border-radius:12px;background:var(--sem-bg-container-lowest,#fcfcfd)}

/* live (dark) */

#phone.lv #squad-v .p-t.v-t{background:var(--sem-bg-container-lowest,#212536)!important}
#phone.lv #squad-v .p-t.v-t:not(.p-on){border-color:var(--sem-border-absolute-alpha-gray,rgba(184,197,224,.2))}
#phone.lv #squad-v .v-t .v-gl{background:rgba(9,13,21,.45)}

#phone.lv #squad-v .v-t .v-m.last{border-bottom-color:#f5f7fa}
#phone.lv #squad-v .v-t :is(.v-od,.v-ln,.v-m){color:#f5f7fa}

/* ===== Squad Builder 3 · targets as a bottom sheet over the player picker ===== */
#squad-v .v-sc{position:fixed;inset:0;z-index:60;background:rgba(9,13,21,.45)}
#squad-v .v-sc.v-new{animation:vScrim .2s ease both}
#squad-v .v-sh{position:fixed;left:0;right:0;bottom:calc(65px + var(--v-fab,0px));z-index:61;height:min(62%,calc(100% - 161px - var(--v-fab,0px)));display:flex;flex-direction:column;border-radius:20px 20px 0 0;background:var(--bg-layout,#eef1f9);box-shadow:0 -8px 24px rgba(9,13,21,.2)}
#squad-v .v-sh.v-new{animation:vSheet .28s cubic-bezier(.2,.8,.2,1) both}
#squad-v .v-gb{flex:none;align-self:center;width:36px;height:4px;margin:8px 0 4px;border-radius:2px;background:rgba(82,103,137,.4)}
#squad-v .v-sb{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px}
#phone.lv #squad-v .v-sh{background:#151923}
/* Golden Sub stays on the left and touches the edge of the frame */
#squad-v .v-sh .p-tg{margin-left:-25px}
#squad-v .v-sh .p-top{overflow:visible}
#squad-v .v-sb{overflow-x:hidden}
#squad-v .v-sb{scrollbar-width:none}
#squad-v .v-sb::-webkit-scrollbar{display:none}
@keyframes vSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes vScrim{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#squad-v .v-sh.v-new,#squad-v .v-sc.v-new{animation:none}}
</style>

<body>

<script>
/* ============ MOCK DATA ============ */
const MOCK = {
  match:{home:'Aston Villa',away:'Juventus',time:'19:00',date:'05/03',league:'English Premier League'}
};

/* ============ SHELL LOGIC ============ */
const SCREENS = []; // { id, name, meta }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('.screen-item').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));
  const el=document.getElementById(id); if(el) el.scrollTop=0; document.getElementById('phone').classList.remove('scrolled');
  document.getElementById('phone').scrollTop=0; document.dispatchEvent(new CustomEvent('screenchange',{detail:id}));
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
}
function fit(){
  const main=document.querySelector('.stage-main'); const sc=document.getElementById('phoneScale');
  const k=Math.min(1,(main.clientHeight-48)/832,(main.clientWidth-48)/400);
  sc.style.transform='scale('+k+')';
}
window.addEventListener('resize',fit);
document.addEventListener('click',e=>{
  const b=e.target.closest('.screen-item'); if(b) showScreen(b.dataset.id);
});

/* ---- team crests: simplified colour-faithful stand-ins, swap for licensed club assets ---- */
const CREST = {
  villa:`<svg viewBox="0 0 32 32" width="100%" height="100%"><path d="M4 3h24v13c0 7-5 11.5-12 14C9 27.500 4 23 4 16z" fill="#670e36"/><path d="M4 3h24v7H4z" fill="#95bfe5"/><path d="M5 3h22v13c0 6.200-4.400 10.300-11 12.700C9.400 26.300 5 22.200 5 16z" fill="none" stroke="#f5c400" stroke-width="1.100"/><path d="M12 24c1-2 .8-4 2-6-1.600.2-3 .4-3.600-1 1.200-.4 2.200-1.400 2.800-2.800-.8-.6-1.400-1.600-1.200-3 1.200.4 2 .1 2.800-.7.6 1.200 1.800 1.800 3 1.800-.4 1 0 2 .8 2.600.8-.8 2-1 2.800-.6-.2 1.600-1.400 2.600-2.800 2.800.6 1.200.8 2.600.2 4.200-.8-1-2-1.200-3-1-.6 1-.8 1.800-1 2.800z" fill="#f5c400"/></svg>`,
  juve:`<svg viewBox="0 0 32 32" width="100%" height="100%"><rect x="6" y="3" width="20" height="26" rx="9" fill="#fff" stroke="#111" stroke-width="1.600"/><path d="M13 7h8v1.800h-3V19c0 3.400-2 5.400-5 5.400-1.800 0-3-.6-3.800-1.600l1.600-1.600c.5.6 1.200.9 2 .9 1.200 0 1.800-.8 1.800-2.400V8.800H13z" fill="#111"/></svg>`,
  city:`<svg viewBox="0 0 32 32" width="100%" height="100%"><circle cx="16" cy="16" r="14.500" fill="#6cabdd"/><circle cx="16" cy="16" r="11.200" fill="#fff"/><circle cx="16" cy="16" r="9.200" fill="#1c2c5b"/><path d="M16 8.500l1.700 5h5.200l-4.200 3.100 1.600 5-4.300-3.100-4.300 3.100 1.600-5-4.200-3.100h5.200z" fill="#6cabdd"/></svg>`,
  united:`<svg viewBox="0 0 32 32" width="100%" height="100%"><circle cx="16" cy="16" r="14.500" fill="#da291c"/><circle cx="16" cy="16" r="12" fill="none" stroke="#fbe122" stroke-width="1.600"/><path d="M10 9.500c1.400-.2 2.400.4 3 1.400h6c.6-1 1.600-1.600 3-1.400-.4 1.200-1 2-2 2.400.8 1.200 1 2.600.6 4.200-.6 2.600-2.400 4.700-4.600 5.700-2.200-1-4-3.100-4.600-5.700-.4-1.600-.2-3 .6-4.200-1-.4-1.600-1.200-2-2.400z" fill="#111"/><path d="M5 23.500c3-.6 5 0 7.500 1.500" stroke="#fbe122" stroke-width="1.300" fill="none" stroke-linecap="round"/></svg>`
};
/* ---- shared building blocks ---- */
const FORM = [['#169c43',0],['#090d15',0],['#ff0042',1],['#d1d9eb',0],['#d1d9eb',0]];
const form = (c)=>`<div class="form">${FORM.map(([col,tail])=>`<div class="tile"><i style="background:${col}"></i>${tail?`<em style="background:${col}"></em>`:'<em style="opacity:0"></em>'}</div>`).join('')}</div>`;
const AI_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#6233ff"><path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8zM18 14l.9 2.6L21.5 17.5l-2.6.9L18 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>';
const CHEV_DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#151923" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

const promptsHTML = (cls='')=>`<div class="prompts ${cls}"><span class="prompt">${AI_SVG} Bet builder for Villa v Juventus</span><span class="prompt">${AI_SVG} Aston Villa performance in last 5 matches?</span></div>`;
function matchHeader(activeTab,withPrompts=false){
  const m=MOCK.match;
  const tabs=['markets','stats','social'];
  return `
  <div class="subheader">
    <div class="left">
      <button class="pill-btn" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151923" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
      <div class="league-pill"><div class="title"><div class="mini-icons"><span class="mini-icon">⚽</span><span class="mini-icon">🇬🇧</span></div><span class="name">${m.league}</span></div>
        <svg width="8" height="6" viewBox="0 0 8 6"><path d="M0 0h8L4 6z" fill="#151923"/></svg></div>
    </div>
    <button class="pill-btn" aria-label="Notifications"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#151923" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></svg></button>
  </div>
  <div class="scoreboard"><div class="stats-summary">
    <div class="sponsor"><span class="logo">Betano</span><span class="txt">SPONSORED</span></div>
    <div class="match">
      <div class="team"><div class="badge"><span class="crest">${CREST.villa}</span></div><div class="tname">${m.home}</div>${form()}</div>
      <div class="kickoff"><div>${m.time}<br>${m.date}</div>
        <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#526789" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div></div>
      <div class="team"><div class="badge"><span class="crest">${CREST.juve}</span></div><div class="tname">${m.away}</div>${form()}</div>
    </div></div></div>
  ${withPrompts?promptsHTML():''}
  <div class="tab-primary"><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" data-go="${t}" aria-selected="${t===activeTab}">${t}</button>`).join('')}</div></div>`;
}
function secMenu(tabs,active,extra=''){
  return `<div class="sec-menu"><div class="box"><div class="sec-tabs" role="tablist">${tabs.map(t=>`<button class="sec-tab" role="tab" data-tab="${t}" aria-selected="${t===active}">${t}${t==='Squad builder'?'<span class="new">NEW</span>':''}</button>`).join('')}</div>${extra}</div></div>`;
}
const footerHTML = `
<div class="footer">
  <div class="info">*Important information regarding data on scoreboards and possible delays during live streaming. Although we strive to constantly ensure that the information provided on this site regarding an event is accurate, it should be used as indicative only. We have no responsibility over information that involves scores, game time etc., which can be inaccurate.</div>
  <hr><div class="fhead">Useful Links ${CHEV_DOWN}</div>
  <div class="links"><span>Betting Rules</span><span>Terms &amp; Conditions</span><span>Responsible Gaming</span><span>Security</span><span>Help Center</span><span>Privacy Policy</span><span>Contact</span></div>
  <hr><div class="fhead">About Us ${CHEV_DOWN}</div>
  <div class="about">Sample placeholder text for the about section. 21+ · Frequent participation in gambling could lead to addiction and loss of assets — play responsibly.</div>
  <hr><div class="social"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="play">PLEASE PLAY RESPONSIBLY!</div>
</div>`;

/* ---- sidebar: only C and D by default; the "Show all versions" switch in Prototype controls reveals the rest ---- */
const VIS_V=['squad-o','squad-p','squad-v']; let allV=false; try{allV=localStorage.getItem('sb:allv')==='1';}catch(e){}
const vHidden=id=>!allV&&/^squad-/.test(id)&&!VIS_V.includes(id);
function applyVis(){ document.querySelectorAll('.screen-item').forEach(b=>{b.hidden=vHidden(b.dataset.id);}); }
function setAllV(on){ allV=on; try{localStorage.setItem('sb:allv',on?'1':'0');}catch(e){} applyVis(); document.querySelectorAll('[data-allv]').forEach(i=>{i.checked=on;}); const cur=location.hash.slice(1); if(vHidden(cur)) showScreen('squad-p'); }
document.addEventListener('change',e=>{const i=e.target.closest('[data-allv]'); if(i) setAllV(i.checked);});
/* ---- screen registry ---- */
function registerScreen(id,name,meta,html){
  SCREENS.push({id,name,meta});
  const sec=document.createElement('section'); sec.className='screen'; sec.id=id; sec.innerHTML=html;
  document.getElementById('phone').insertBefore(sec,document.querySelector('.bottom-nav'));
  const b=document.createElement('button'); b.className='screen-item'; b.dataset.id=id;
  b.innerHTML=`<span class="name">${name}</span><span class="meta">${meta}</span>`;
  document.querySelector('.screen-list').appendChild(b);
}
document.addEventListener('click',e=>{ const q=e.target.closest('.sec-tab[data-tab]'); if(q){ if(q.dataset.tab==='Squad builder'&&!/^squad-/.test(q.closest('.screen').id)) showScreen('squad-m'); } });
document.addEventListener('click',e=>{ const t=e.target.closest('[data-go]'); if(t && document.getElementById(t.dataset.go)) showScreen(t.dataset.go); });

/* ===== SCREEN 1: MARKETS ===== */
(function(){

/* Live dark theme: the component rules hard-code Figma hex values, so build a dark twin of every squad rule under #phone.lv by mapping light surfaces, text and borders to their dark equivalents */
(function darkTwin(){
  const BG={'#fff':'#212536','#ffffff':'#212536','#fcfcfd':'#151923','#eff2fa':'#090915','#f7f9fc':'#2a3046','#f5f7fa':'#2a3046','#eaeefb':'#2d374d','#e2e8f8':'#2d374d','#f0f3fa':'#2a3046'};
  const FG={'#151923':'#f5f7fa','#090d15':'#f5f7fa','#2a3346':'#cfd9ed','#2a3046':'#cfd9ed','#526789':'#c0cce7','#8092b3':'#8092b3','#db3300':'#ff825c'};
  const BD={'#e2e8f8':'#2d374d','#e1e6ef':'#2d374d','#d1d9eb':'#3b4863','#dbe5f5':'#2d374d','#c2cee5':'#3b4863','#a9b9d1':'#455573','#fff':'#343f56','#ffffff':'#343f56'};
  const map=(v,m)=>v.replace(/#[0-9a-f]{3,6}\b/gi,h=>m[h.toLowerCase()]||h);
  let out='';
  for(const sh of document.styleSheets){ let rules; try{rules=sh.cssRules}catch(e){continue}
    for(const r of rules){ if(r.type!==1||!/squad-|\.k-|\.m-|\.q-|\.p-|\.pf-/.test(r.selectorText)||/#phone\.lv|\.lv-/.test(r.selectorText)) continue;
      const d=[]; for(let i=0;i<r.style.length;i++){ const p=r.style[i], v=r.style.getPropertyValue(p); let n=v;
        if(/^background(-color)?$/.test(p)) n=map(v,BG); else if(p==='color'||p==='fill') n=map(v,FG); else if(/^border/.test(p)) n=map(v,BD);
        if(n!==v) d.push(p+':'+n+(r.style.getPropertyPriority(p)?' !important':'')); }
      if(d.length) out+=r.selectorText.split(',').map(x=>'#phone.lv '+x.trim()).join(',')+'{'+d.join(';')+'}\n'; } }
  const st=document.createElement('style'); st.id='lv-dark'; st.textContent=out; document.head.appendChild(st);
})();
/* On-screen number pad for the goal value fields: the prototype is shown on a desktop, so the phone gets its own keypad (tap a value, type, Done) */
(function(){ if(window.__kbShow) return; let inp=null, fresh=false, kb=null;
  const mk=()=>{ const ph=document.getElementById('phone'); if(!ph) return null; kb=document.createElement('div'); kb.className='gl-kb'; kb.hidden=true; kb.setAttribute('role','group'); kb.setAttribute('aria-label','Number pad');
    kb.innerHTML='<div class="gl-kt"><button data-k="done">Done</button></div><div class="gl-kg">'+['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<span></span>':`<button data-k="${k}" aria-label="${k==='del'?'Delete':k}">${k==='del'?'<svg width="24" height="18" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 1h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8L1 9z"/><path d="m12 6 6 6m0-6-6 6" stroke-linecap="round"/></svg>':k}</button>`).join('')+'</div>';
    ph.appendChild(kb); kb.addEventListener('mousedown',e=>e.preventDefault());
    kb.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!inp) return; const k=b.dataset.k;
      if(k==='done'){ hide(true); return; }
      let v=fresh?'':inp.value; fresh=false; v=k==='del'?v.slice(0,-1):(v+k).slice(0,3); inp.value=v; });
    return kb; };
  function hide(commit){ if(!kb) return; const i=inp; kb.hidden=true; document.getElementById('phone').classList.remove('kb-on'); inp=null; if(i&&i.isConnected){ if(commit) i.dispatchEvent(new Event('change',{bubbles:true})); i.blur(); } }
  window.__kbShow=function(i){ if(!kb&&!mk()) return; if(inp&&inp!==i&&inp.isConnected) inp.dispatchEvent(new Event('change',{bubbles:true})); inp=i; fresh=true; kb.hidden=false; document.getElementById('phone').classList.add('kb-on'); setTimeout(()=>{ try{i.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){} },30); };
  document.addEventListener('mousedown',e=>{ if(inp&&!e.target.closest('.gl-kb')&&!e.target.closest('.gl-in')) hide(true); },true);
  document.addEventListener('keydown',e=>{ if(!inp) return; if(/^\d$/.test(e.key)){ e.preventDefault(); let v=fresh?'':inp.value; fresh=false; inp.value=(v+e.key).slice(0,3); } else if(e.key==='Backspace'){ e.preventDefault(); fresh=false; inp.value=inp.value.slice(0,-1); } else if(e.key==='Enter'||e.key==='Escape'){ e.preventDefault(); hide(e.key==='Enter'); } });
})();

    btn.setAttribute('aria-pressed',String(open)); btn.toggleAttribute('aria-current',open); btn.setAttribute('aria-current',String(open));
    if(open){ document.querySelectorAll('.screen-item').forEach(b=>b.setAttribute('aria-current','false')); notes.scrollTop=0; }
    else { let id=location.hash.slice(1)||(allV?'squad-m':'squad-p'); if(vHidden(id)) id='squad-p'; showScreen(document.getElementById(id)?id:'squad-p'); }
  }
  btn.addEventListener('click',()=>setNotes(!notes.classList.contains('open')));
  notes.addEventListener('click',e=>{ if(e.target.closest('[data-notes-close]')) setNotes(false); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&notes.classList.contains('open')) setNotes(false); });
  document.addEventListener('click',e=>{ if(e.target.closest('.screen-item')&&notes.classList.contains('open')){ notes.classList.remove('open'); main.classList.remove('notes-open'); btn.setAttribute('aria-pressed','false'); btn.setAttribute('aria-current','false'); } },true);
  foot.querySelector('#reloadBtn').addEventListener('click',()=>{ const u=new URL(location.href); u.searchParams.set('v',Date.now()); location.replace(u.toString()); });
})();
/* @@SCREEN-JS-END@@ */
fit();
(function(){ applyVis(); const DEFAULT_SCREEN=allV?'squad-m':'squad-p'; let id=location.hash.slice(1)||DEFAULT_SCREEN; if(vHidden(id)) id='squad-p'; if(!document.getElementById(id)) id=document.querySelector('.screen')?.id; if(id) showScreen(id); })();
</script>
</body>
